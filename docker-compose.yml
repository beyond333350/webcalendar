version: '3.8'

services:
  webcalendar:
    build: .
    image: webcalendar:latest
    container_name: webcalendar
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - webcalendar_data:/app/data
    environment:
      - PORT=3000
      - JWT_SECRET=webcalendar-1panel-secret-2026

volumes:
  webcalendar_data:
    driver: local
