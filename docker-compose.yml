version: '3.8'

services:
  webcalendar:
    build: .
    image: webcalendar:latest
    container_name: webcalendar
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - JWT_SECRET=webcalendar-1panel-secret-2026
      # 初始超级管理员账号（首次启动若该账户不存在时自动初始化创建，也可在 .env 中设置）
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=change_this_password
